spring.application.name=gamer-events
server.port=8082

# Cookie de sesion no accesible desde JavaScript
server.servlet.session.cookie.http-only=true

# Base de datos MySQL: las credenciales se leen desde variables de entorno, nunca se escriben en el codigo
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gamer_events?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: clave de firma (minimo 32 caracteres) y duracion del token
jwt.secret=${JWT_SECRET:}
jwt.expiracion-minutos=60
