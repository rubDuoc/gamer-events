spring.application.name=gamer-events

# Las pruebas usan una base H2 en memoria, asi no necesitan MySQL
spring.datasource.url=jdbc:h2:mem:gamer_events;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=clave-de-pruebas-con-mas-de-32-caracteres
jwt.expiracion-minutos=60
