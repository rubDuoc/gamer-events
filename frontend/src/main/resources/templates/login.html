<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container form-box">
    <h1>Iniciar sesión</h1>

    <div class="alert error" th:if="${param.error}">Correo o contraseña incorrectos.</div>
    <div class="alert ok" th:if="${param.logout}">Cerraste sesión correctamente.</div>
    <div class="alert error" th:if="${param.expirada}">Tu sesión expiró. Vuelve a iniciar sesión.</div>
    <div class="alert ok" th:if="${param.registrado}">Cuenta creada. Ya puedes iniciar sesión.</div>

    <form th:action="@{/login}" method="post">
        <label>Correo
            <input type="email" name="username" required autofocus>
        </label>
        <label>Contraseña
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn">Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
</main>
</body>
</html>
