spring.application.name=gamer-events-web
server.port=8082

# Cookie de sesion no accesible desde JavaScript
server.servlet.session.cookie.http-only=true
# La cookie de sesion no se envia en peticiones desde otros sitios (hallazgo de ZAP, OWASP A01 / CSRF)
server.servlet.session.cookie.same-site=strict

# Direccion de la API REST del backend
backend.url=${BACKEND_URL:http://localhost:8090}
